[project]
name = "harbor-videogamebench-adapter"
version = "0.1.0"
description = "VideoGameBench Game Boy Lite integration for Harbor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3"]

[project.scripts]
videogamebench = "videogamebench.main:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.1", "ty==0.0.89", "Pillow==12.0.0", "ImageHash==4.3.2", "pyboy==2.6.1"]

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "videogamebench"

[tool.ty.src]
exclude = ["src/videogamebench/task-template"]
