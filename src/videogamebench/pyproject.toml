[project]
name = "harbor-videogamebench-adapter"
version = "0.1.0"
description = "VideoGameBench public Game Boy and DOS integration for Harbor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
harbor = ["harbor==0.24.0"]
runtime = ["numpy", "pyboy==2.6.1", "pygame", "Pillow==12.0.0", "ImageHash==4.3.2", "pydantic", "tqdm", "rich", "gymnasium", "opencv-python-headless", "openai", "anthropic", "playwright", "litellm", "python-dotenv"]

[project.scripts]
videogamebench = "videogamebench.main:main"
videogamebench-experiment = "videogamebench.experiment:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.1", "ty==0.0.89", "Pillow==12.0.0", "ImageHash==4.3.2", "pyboy==2.6.1"]

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "videogamebench"
source-include = ["oracle-inputs/**", "experiments/**", "run_videogamebench.yaml"]

[tool.ty.src]
exclude = ["src/videogamebench/task-template", "src/videogamebench/runtime", "tests/harness_probe.py"]
