version = "1.0"
artifacts = [{source = "/state", service = "game"}]

[task]
name = "videogamebench/{task_id}"
authors = [{name = "Alex L. Zhang"}, {name = "Thomas L. Griffiths"}, {name = "Karthik R. Narasimhan"}, {name = "Ofir Press"}]

[metadata]
mode = "{mode}"
source_revision = "{revision}"

[agent]
timeout_sec = {agent_timeout_sec}

[environment]
build_timeout_sec = {build_timeout_sec}
cpus = {cpus}
memory_mb = {memory_mb}
storage_mb = {storage_mb}
network_mode = "public"

[verifier]
timeout_sec = {verifier_timeout_sec}
environment_mode = "separate"

[[verifier.collect]]
service = "game"
command = "python /opt/game/play.py --url http://localhost:8080 --finish"
timeout_sec = 180

[verifier.environment]
build_timeout_sec = {build_timeout_sec}
cpus = 1
memory_mb = 512
network_mode = "no-network"
