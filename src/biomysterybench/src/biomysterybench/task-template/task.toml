version = "1.0"
artifacts = ["/workspace/answer.txt", "/workspace/report.md"]

[task]
name = "anthropic/{task_id}"
authors = [{name = "Anthropic"}]

[metadata]
source_id = "{source_id}"
source_revision = "b5a889c4757214ec9a6ade876b734f920a7799db"
human_solvable = "{human_solvable}"

[agent]
timeout_sec = 7200

[environment]
build_timeout_sec = 1800
cpus = 4
memory_mb = 16384
storage_mb = 102400
network_mode = "allowlist"
allowed_hosts = {allowed_hosts}

[verifier]
timeout_sec = 180
environment_mode = "separate"

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY}"

[verifier.environment]
build_timeout_sec = 600
cpus = 1
memory_mb = 2048
