# Prepared only. Paths are relative to the repository root.
job_name: biomysterybench-v11-sonnet5-run1
jobs_dir: jobs
n_attempts: 1
n_concurrent_trials: 1
retry:
  max_retries: 0
datasets:
  - path: datasets/biomysterybench-parity
agents:
  - import_path: parity_agent:ParityAgent
    model_name: anthropic/claude-sonnet-5
    kwargs:
      api_base: https://api.anthropic.com/v1
      max_turns: 150
      max_tokens: 32768
      thinking:
        type: adaptive
      effort: high
      request_timeout_sec: 900
      tool_timeout_sec: 600
      max_tool_output_chars: 100000
    extra_allowed_hosts: []
environment:
  type: docker
  delete: true
  extra_allowed_hosts: []
metrics:
  - type: uv-script
    kwargs:
      script_path: src/biomysterybench/src/biomysterybench/metric.py
