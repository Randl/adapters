version = "1.0"
artifacts = ["/workspace/review.json"]

[task]
name = "withmartian/{task_id}"
authors = [{name = "Martian"}]

[metadata]
source_revision = "e616e849755441da38f18bf3adba2c9583b03803"
base_commit = "{base}"
head_commit = "{head}"

[agent]
timeout_sec = 1800

[environment]
build_timeout_sec = 1800
cpus = 2
memory_mb = 4096
storage_mb = 20480
network_mode = "no-network"

[verifier]
timeout_sec = 1800
environment_mode = "separate"
network_mode = "allowlist"
allowed_hosts = [{judge_host}]

[verifier.env]
JUDGE_API_KEY = "${JUDGE_API_KEY}"
JUDGE_MODEL = {judge_model}
JUDGE_BASE_URL = {judge_base_url}
JUDGE_TEMPERATURE = {judge_temperature}

[verifier.environment]
build_timeout_sec = 600
cpus = 1
memory_mb = 2048
